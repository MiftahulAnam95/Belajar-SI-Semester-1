<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Editor praktik algoritma dan dasar pemrograman semester 1." />
    <title>Editor | SI Semester 1 Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body data-page="editor">
    <div id="appNav"></div>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow"><i class="bi bi-terminal"></i> Lab praktik</span>
          <h1>Jalankan contoh web kecil, algoritma, dan JavaScript dasar.</h1>
          <p>Editor ini menyimpan latihan di browser dan menampilkan preview serta console sederhana.</p>
        </div>
      </section>

      <section class="section-block alt-section">
        <div class="container">
          <div class="editor-shell">
            <div class="editor-toolbar">
              <div class="editor-dots" aria-hidden="true"><span></span><span></span><span></span></div>
              <span class="editor-title">si-semester-1-practice</span>
              <div class="editor-actions">
                <button class="btn btn-run" type="button" id="runEditor"><i class="bi bi-play-fill"></i> Run</button>
                <button class="btn btn-editor" type="button" id="saveEditor"><i class="bi bi-floppy"></i> Simpan</button>
                <button class="btn btn-editor" type="button" id="resetEditor"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
              </div>
            </div>
            <div class="editor-layout">
              <div class="editor-pane">
                <div class="editor-tabs" role="tablist" aria-label="File latihan">
                  <button class="editor-tab active" type="button" data-editor-tab="html">index.html</button>
                  <button class="editor-tab" type="button" data-editor-tab="css">style.css</button>
                  <button class="editor-tab" type="button" data-editor-tab="js">app.js</button>
                </div>
                <textarea class="code-input" id="htmlInput" data-editor-input="html" spellcheck="false"></textarea>
                <textarea class="code-input d-none" id="cssInput" data-editor-input="css" spellcheck="false"></textarea>
                <textarea class="code-input d-none" id="jsInput" data-editor-input="js" spellcheck="false"></textarea>
              </div>
              <div class="preview-pane">
                <div class="preview-label"><i class="bi bi-eye"></i> Preview</div>
                <iframe id="previewFrame" title="Preview latihan" sandbox="allow-scripts"></iframe>
                <div class="console-pane">
                  <div class="console-label"><i class="bi bi-terminal"></i> Console</div>
                  <pre id="editorConsole"></pre>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="appFooter"></div>
    <div id="appToast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/progress.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/editor.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
